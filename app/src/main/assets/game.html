<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Game</title>
  <style>
    html,body{margin:0;height:100%;background:#1565C0;color:#fff;
      font-family:sans-serif;overflow:hidden;touch-action:manipulation}
    #btn{position:absolute;inset:10% 20%;border:0;border-radius:40px;
      background:#fff;color:#1565C0;font-size:8vmin;font-weight:900}
  </style>
</head>
<body>
  <button id="btn" ontouchstart="send()">TAP</button>
  <script>
    let taps = 0;
    function send() {
      taps++;
      const state = { taps, ts: Date.now() };
      if (window.AndroidRTC) {
        window.AndroidRTC.sendGameStateToDad(JSON.stringify(state));
      }
    }
    // Called from Kotlin with a pre-quoted JSON literal.
    window.receiveRemoteGameState = function(json) {
      try {
        const s = typeof json === 'string' ? JSON.parse(json) : json;
        document.title = 'Remote taps: ' + s.taps;
      } catch (e) { /* ignore malformed */ }
    };
  </script>
</body>
</html>
