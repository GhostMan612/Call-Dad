# Call-Dad version catalog. Donor pins frozen until ADR (AGP 8.13.2 / Kotlin 2.1.0 / Gradle 8.13).
# Phase 1 scaffold uses Compose BOM 2024.10.01 per operator-provided scaffold (drift from frozen 2024.12.01 noted in handoff).
# Phase 2 adds Firebase BOM 33.5.1 + google-services 4.4.2 + coroutines-play-services.
# REJECTED here: operator draft's AGP 8.7.2 / Kotlin 2.0.21 downgrade — frozen pins kept (see handoff).
[versions]
agp = "8.13.2"
kotlin = "2.1.0"
compose-bom = "2024.10.01"
core-ktx = "1.13.1"
activity-compose = "1.9.3"
lifecycle = "2.8.7"
navigation-compose = "2.8.4"
coroutines = "1.9.0"
junit = "4.13.2"

# --- Phase 2 additions ---------------------------------------------------
firebase-bom = "33.5.1"
google-services = "4.4.2"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# --- Phase 2 additions ---------------------------------------------------
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase-bom" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore-ktx" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# --- Phase 2 additions ---------------------------------------------------
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
