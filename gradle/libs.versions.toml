[versions]
agp = "8.7.2"
kotlin = "2.0.21"
coreKtx = "1.13.1"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
lifecycle = "2.8.7"
navigationCompose = "2.8.4"
coroutines = "1.9.0"

# --- Phase 2 additions (bumped) -----------------------------------------
googleServices = "4.5.0"
firebaseBom = "34.19.0"

# --- Phase 3 additions --------------------------------------------------
# CORRECTED 2026-09-19: real artifact is stream-webrtc-android (Maven Central,
# latest stable 1.3.10); architect's webrtc-android:1.1.0 does not exist.
webrtc = "1.3.10"

# --- Phase 5 additions --------------------------------------------------
# firebase-auth/messaging are BOM-managed (no pins — BOM 34.19.0 decides).
# play-services-auth is NOT BOM-managed: explicit pin per architect.
play-services-auth = "21.3.0"

# --- Phase 7 additions --------------------------------------------------
# WebViewAssetLoader (replaces file:///android_asset).
webkit = "1.12.1"

# --- Phase 12 additions -------------------------------------------------
# Plaintext peer persistence (SecurePeerStore). Tink deliberately omitted:
# two-person sideloaded threat model; allowBackup=false + D2D rules cover it.
datastorePreferences = "1.1.1"

# --- Contract 4 additions (pairing: CameraX + unbundled ML Kit + ZXing) --
# Unbundled ML Kit pivot is for APK size (~2.4MB -> ~200KB); the 16KB
# alignment issue is resolved in 18.3.1. play-services-base carries
# ModuleInstallClient (OptionalModuleApi install path).
camerax = "1.6.1"
mlkitBarcode = "18.3.1"
zxing = "3.5.3"
kotlinxCoroutinesPlayServices = "1.10.2"
playServicesBase = "18.5.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# --- Phase 2 additions (bumped, KTX merged into main artifacts) ---------
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }

# --- Phase 3 additions (Stream WebRTC fork; same org.webrtc.* package names) --
webrtc-android = { group = "io.getstream", name = "stream-webrtc-android", version.ref = "webrtc" }

# --- Phase 5 additions (BOM-managed auth/messaging; pinned play-services-auth)
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "play-services-auth" }

# --- Phase 7 additions --------------------------------------------------
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }

# --- Phase 12 additions -------------------------------------------------
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }

# --- Contract 4 additions -------------------------------------------------
camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
camerax-mlkit-vision = { group = "androidx.camera", name = "camera-mlkit-vision", version.ref = "camerax" }
mlkit-barcode-scanning = { group = "com.google.android.gms", name = "play-services-mlkit-barcode-scanning", version.ref = "mlkitBarcode" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "kotlinxCoroutinesPlayServices" }
play-services-base = { group = "com.google.android.gms", name = "play-services-base", version.ref = "playServicesBase" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }